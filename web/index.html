<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>TRI-27 — VM ternaire (WASM)</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #111316; color: #d6d9de; font: 14px system-ui, sans-serif; }
  header { padding: 8px 14px; background: #181b20; border-bottom: 1px solid #2a2f37; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0 12px 0 0; color: #9ecbff; }
  button, select, input { background: #232830; color: #d6d9de; border: 1px solid #3a414c; border-radius: 4px; padding: 5px 10px; font: inherit; }
  button:hover { background: #2d3440; }
  button.primary { background: #1f4f7a; border-color: #2e6aa0; }
  input[type=number] { width: 110px; }
  main { display: flex; gap: 12px; padding: 12px; align-items: flex-start; flex-wrap: wrap; }
  #left { flex: 1 1 480px; display: flex; flex-direction: column; gap: 8px; min-width: 380px; }
  #src { width: 100%; height: 640px; resize: vertical; background: #0b0d10; color: #cfe3c8; border: 1px solid #2a2f37; border-radius: 4px; padding: 8px; font: 13px/1.35 Consolas, "Cascadia Mono", monospace; tab-size: 8; white-space: pre; }
  #right { display: flex; flex-direction: column; gap: 8px; }
  #screen { width: 960px; height: 600px; image-rendering: pixelated; background: #000; border: 1px solid #2a2f37; outline: none; }
  #screen:focus { border-color: #4a8fd0; }
  #console { width: 960px; height: 180px; overflow: auto; margin: 0; background: #0b0d10; border: 1px solid #2a2f37; border-radius: 4px; padding: 8px; font: 13px/1.35 Consolas, monospace; color: #e8e8e8; white-space: pre-wrap; outline: none; cursor: text; }
  #console:focus { border-color: #4a8fd0; }
  #console:focus::after { content: "\2588"; color: #7ee787; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #termhint { font: 12px Consolas, monospace; color: #7ee787; }
  #stats { font: 12px Consolas, monospace; color: #8b949e; }
  #status.err { color: #ff7b72; }
  #status.ok { color: #7ee787; }
  .hint { color: #8b949e; font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>TRI-27 · VM ternaire</h1>
  <button id="btnRun" class="primary">Assembler + Lancer</button>
  <button id="btnPause">Pause</button>
  <button id="btnReset">Reset</button>
  <label>Exemple <select id="examples"><option value="__demo">Démo intégrée (dégradé TRGB)</option></select></label>
  <label>Budget/frame <input id="budget" type="number" min="1000" step="100000" value="2000000"></label>
  <span id="status"></span>
</header>
<main>
  <div id="left">
    <textarea id="src" spellcheck="false"></textarea>
    <div class="hint">Clavier : cliquer sur l'écran ou dans la console. Écran → KEY (−7) ; console → caractères CONSOLE_IN (−2) ; souris sur l'écran → −10..−12.</div>
  </div>
  <div id="right">
    <canvas id="screen" width="320" height="200" tabindex="0"></canvas>
    <div id="stats">—</div>
    <div id="termhint">▸ Clique dans la console ci-dessous et tape (ex. help puis Entrée). Le curseur vert clignote quand elle a le focus.</div>
    <pre id="console" tabindex="0"></pre>
  </div>
</main>
<script>
  // contourne le cache du navigateur : app.js et tri27.wasm changent souvent
  document.write('<script src="app.js?v=' + Date.now() + '"><\/script>');
</script>
</body>
</html>
